name: Security

# Secret scanning with gitleaks and a production dependency audit. CodeQL and dependency-review are left out on
# purpose: they need GitHub Advanced Security on private repositories, which
# this repo does not have.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR runs are cancelled; a push to `main` must not cancel the
# scheduled scan or the previous commit's secret scan.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Update both together: version and the sha256 of its linux_x64 archive from
  # https://github.com/gitleaks/gitleaks/releases (gitleaks_<version>_checksums.txt).
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary is pinned and checksum-verified instead of using a third-party
      # action (the official action needs a paid licence for organisation repos).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Scans every commit reachable from the checked-out ref. --redact keeps
      # matched values out of the CI log. A finding exits non-zero and fails the check.
      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner --verbose --config .gitleaks.toml .

  # Known vulnerabilities in what ships to visitors (P4.4). Production
  # dependencies only: the dev-tooling advisories (lint, test) never reach a
  # visitor and are reviewed through Dependabot instead. Runs weekly too, so a
  # new advisory against an unchanged lockfile still turns this red.
  audit:
    name: pnpm audit (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack (pnpm from the packageManager field)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
